<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier Slides</title>
    <script>
      // Apply the saved theme and language before first paint (mirrors src/lib/theme.ts, i18n.ts).
      ;(function () {
        var modes = { morandi: "light", celadon: "light", dusk: "dark", midnight: "dark" }
        var id = "morandi"
        try {
          var saved = localStorage.getItem("frontier-slides:theme")
          if (saved === "system") id = matchMedia("(prefers-color-scheme: dark)").matches ? "dusk" : "morandi"
          else if (modes[saved]) id = saved
          if (localStorage.getItem("frontier-slides:lang") === "zh") document.documentElement.lang = "zh-CN"
        } catch (e) {}
        var d = document.documentElement
        d.dataset.theme = id
        d.style.colorScheme = modes[id]
        if (modes[id] === "dark") d.classList.add("dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
