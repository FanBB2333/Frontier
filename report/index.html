<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="report-id" content="%REPORT_ID%" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M16 8v6M9 18v-2h14v2M9 18v6M23 18v6' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>项目汇报</title>
    <script>
      // Apply the saved colour mode and accent before first paint (mirrors src/components/theme-provider.tsx).
      ;(function () {
        // In the gallery the host page's mode stands in for the OS one (see src/lib/system-scheme.ts).
        var host = parent !== window && new URLSearchParams(location.search).get("scheme")
        var systemDark = host === "dark" || (host !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        var d = document.documentElement
        var mode = "system"
        var accent = "kumo"
        try {
          mode = localStorage.getItem("frontier-report:mode") || mode
          accent = localStorage.getItem("frontier-report:accent") || accent
        } catch (e) {}
        if (mode !== "light" && mode !== "dark") mode = systemDark ? "dark" : "light"
        d.setAttribute("data-mode", mode)
        d.setAttribute("data-theme", accent)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
